services:
  flask:
    build: ./flask
    volumes:
      - ./flask:/usr/src/app
    ports:
      - "5000:5000"

  nginx:
    image: nginx
    ports:
      - "7081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask

  redis:
    build: ./redis

    volumes:
      - redis-data:/data

volumes:
  redis-data:
